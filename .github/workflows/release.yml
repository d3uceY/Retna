name: release

# A release is a tag push, so the tag is the single source of truth for the
# version. The workflow only matches v-prefixed tags, which keeps it from firing
# on stray tags.
on:
  push:
    tags:
      - "v*"

# Required for GoReleaser to create the release and upload the archives with the
# built-in token. The npm jobs below narrow this to what they need and add
# id-token, so a job-level permissions block is not optional there.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser walks the history to build the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Gate the release on the tests, so a broken tag cannot publish binaries.
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Creates the release and uploads the archives. Scoped to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only to push the Homebrew cask to d3uceY/homebrew-retna,
          # which is a second repository. A PAT with write access to the tap.
          # See CONTRIBUTING.md, "Releasing".
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}

  # Publishes the six platform packages to npm. Each one carries the bare binary
  # for a single os/arch pair, unpacked out of the archive GoReleaser just
  # uploaded. npm installs only the package whose os and cpu match the machine,
  # which is why there is no postinstall and no download at install time.
  npm-platform:
    name: npm ${{ matrix.package }}
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Reads the tree and nothing is pushed back to git.
      contents: read
      # Lets npm attach a provenance attestation to each published tarball.
      id-token: write
    strategy:
      # One platform failing must not cancel the other five. What did publish is
      # additive, and the guard in the publish step makes a re-run of the whole
      # workflow safe.
      fail-fast: false
      # The asset names come from .goreleaser.yaml, whose name_template leaves
      # the version out: the tag in the URL is what pins the version.
      matrix:
        include:
          - package: retna-linux-x64
            asset: retna_Linux_x86_64.tar.gz
            format: tar.gz
            binary: retna
          - package: retna-linux-arm64
            asset: retna_Linux_arm64.tar.gz
            format: tar.gz
            binary: retna
          - package: retna-darwin-x64
            asset: retna_Darwin_x86_64.tar.gz
            format: tar.gz
            binary: retna
          - package: retna-darwin-arm64
            asset: retna_Darwin_arm64.tar.gz
            format: tar.gz
            binary: retna
          - package: retna-win32-x64
            asset: retna_Windows_x86_64.zip
            format: zip
            binary: retna.exe
          - package: retna-win32-arm64
            asset: retna_Windows_arm64.zip
            format: zip
            binary: retna.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes an .npmrc holding the token from NODE_AUTH_TOKEN. npm finds it
          # from any working directory, which is what makes the publish below
          # work from inside a package subdirectory.
          registry-url: https://registry.npmjs.org

      # The tag is the version. The script strips the leading v, checks the rest
      # is real semver, and points all seven package files at it. It fails here,
      # before anything is published, if the tag is not publishable.
      - name: Version from the tag
        run: |
          set -euo pipefail
          version="$(node npm/scripts/version.js "$GITHUB_REF_NAME")"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unpack the binary
        env:
          ASSET: ${{ matrix.asset }}
          FORMAT: ${{ matrix.format }}
          BINARY: ${{ matrix.binary }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$ASSET"

          if [ "$FORMAT" = "zip" ]; then
            unzip -q "$tmp/$ASSET" -d "$tmp/out"
          else
            mkdir -p "$tmp/out"
            tar -xzf "$tmp/$ASSET" -C "$tmp/out"
          fi

          # The archives also hold LICENSE and README.md. Take only the binary,
          # so the published package is one file and nothing else.
          dest="npm/platforms/$PACKAGE/bin"
          mkdir -p "$dest"
          mv "$tmp/out/$BINARY" "$dest/$BINARY"
          chmod +x "$dest/$BINARY"

      - name: Publish
        working-directory: npm/platforms/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # A re-run must not fail on a version npm already has. Published
          # versions are immutable, so skipping is the right answer.
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published, skipping."
            exit 0
          fi
          npm publish --provenance --access public

  # Publishes the wrapper, last. Its optionalDependencies pin the six versions
  # above, so it can only go out once they exist on the registry.
  npm-wrapper:
    name: npm retna
    needs: npm-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Version from the tag
        run: |
          set -euo pipefail
          version="$(node npm/scripts/version.js "$GITHUB_REF_NAME")"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Only the wrapper needs this. The package page is rendered from a README
      # in the tarball, where the root README's relative image and skill paths
      # lead nowhere, so the npm copy is built with them made absolute.
      - name: Build the README
        run: node npm/scripts/readme.js

      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if npm view "retna@$VERSION" version >/dev/null 2>&1; then
            echo "retna@$VERSION is already published, skipping."
            exit 0
          fi
          npm publish --provenance --access public
