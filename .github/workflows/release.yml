name: release

# A release is a tag push, so the tag is the single source of truth for the
# version. The workflow only matches v-prefixed tags, which keeps it from firing
# on stray tags.
on:
  push:
    tags:
      - "v*"

# Required for GoReleaser to create the release and upload the archives with the
# built-in token.
permissions:
  contents: write
  # npm --provenance signs an attestation through GitHub's OIDC provider.
  id-token: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser walks the history to build the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Gate the release on the tests, so a broken tag cannot publish binaries.
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Creates the release and uploads the archives. Scoped to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only to push the Homebrew cask to d3uceY/homebrew-retna,
          # which is a second repository. A PAT with write access to the tap.
          # See CONTRIBUTING.md, "Releasing".
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}

      # The npm package downloads the binary for the machine it installs on
      # from the release above, so it must be published after GoReleaser has
      # uploaded the archives. See CONTRIBUTING.md, "The npm package".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # The package page is rendered from a README in the tarball, where the
      # root README's relative image and skill paths lead nowhere, so the npm
      # copy is built with them made absolute.
      - name: Build the npm README
        run: node npm/scripts/readme.js

      # The npm package version must match the release binary it downloads.
      - name: Stamp npm package version from the tag
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # The release exists already, so the install-time download resolves.
      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

