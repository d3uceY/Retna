# Release configuration for Retna.
#
# A release is a tag push. See .github/workflows/release.yml for the automated
# path, or dry run locally with:
#
#   goreleaser release --snapshot --clean
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: retna

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -s -w strips the symbol table and debug info, which roughly halves the
    # binary. The version is injected so "retna version" reports the tag rather
    # than the placeholder in cmd/root.go.
    ldflags:
      - -s -w
      - -X github.com/d3uceY/Retna/cmd.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    # This name template matches what `uname` reports, so downloaded archives
    # are named the way scripts expect.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishes the cask to the d3uceY/homebrew-retna tap, which is a SECOND
# repository. The built-in GITHUB_TOKEN only reaches the repo the workflow runs
# in, so the tap push needs its own token. See HOMEBREW_TAP_GITHUB_TOKEN in
# .github/workflows/release.yml.
homebrew_casks:
  - name: retna
    homepage: "https://github.com/d3uceY/Retna"
    description: "Convert colors between color spaces and measure their contrast"
    directory: Casks
    repository:
      owner: d3uceY
      name: homebrew-retna
      branch: main
      # A personal access token with write access to the tap. Without this,
      # goreleaser falls back to GITHUB_TOKEN and the push is rejected.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

release:
  footer: >-

    ---
    Released by [d3uceY](https://github.com/d3uceY).
