# Release configuration for Retna.
#
# A release is a tag push. See .github/workflows/release.yml for the automated
# path, or dry run locally with:
#
#   goreleaser release --snapshot --clean
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: retna

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -s -w strips the symbol table and debug info, which roughly halves the
    # binary. The version is injected so "retna version" reports the tag rather
    # than the placeholder in cmd/root.go.
    ldflags:
      - -s -w
      - -X github.com/d3uceY/Retna/cmd.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    # This name template matches what `uname` reports, so downloaded archives
    # are named the way scripts expect.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---
    Released by [d3uceY](https://github.com/d3uceY).
